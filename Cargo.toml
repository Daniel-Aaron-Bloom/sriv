[package]
name = "sriv"
version = "0.1.0"
edition = "2024"

[dependencies]
# slint and its internal crates are released together and slint's internals
# expect a matching i-slint-core/backend; bump all three in lockstep.
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
i-slint-backend-winit = "=1.18.1"
i-slint-core = "=1.18.1"
winit = "0.30"
image = { version = "0.25" }
resvg = "0.48"
# Binds to the system libheif (libheif-dev); libheif-sys 5.3.x needs >= 1.23.1.
libheif-rs = "3.0.0"

[build-dependencies]
slint-build = "1"
